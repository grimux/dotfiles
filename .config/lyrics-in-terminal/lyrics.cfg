# config structure

[OPTIONS]
alignment=left
source=google
interval=1500
player=mpd
autoswitch=on
statusbar=on
#colors
#offset=1

# mpd config
mpd_host=127.0.0.1
mpd_port=6600
mpd_pass=


[BINDINGS]
# scroll
up=k
down=j
step-up=arrow_left
step-down=arrow_right
step-size=5

# source switch key
google=R
azLyrics=r
cycle-source=c

# text alignment
left=b
center=n
right=m

autoswitchtoggle=a

# editing
delete=d
edit=e

# search
find=/
find-next=n
find-prev=p

help=h
quit=q
